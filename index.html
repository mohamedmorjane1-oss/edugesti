 const grp=(h,key,items,src)=>`<h3>${h}</h3><div class="exchs">${items.map((t,i)=>`<label class="exc"><input type="checkbox" data-qk="${key}_${i}"${a[key][i]?' checked':''}> ${t}</label>`).join('')}</div>`;

function bindMva(){const a=MQA(),pm=()=>$('#pm'),re=()=>{const o=$('#exov');if(o){o.innerHTML=mqPages(a).join('');fitPrev()}},full=()=>{$('#mqform').innerHTML=mqForm();wire();re()};
 const opts=(c)=>'<option value="">— اختر التلميذ(ة) —</option>'+(CL[c]||[]).map(n=>`<option>${esc(n)}</option>`).join('');
